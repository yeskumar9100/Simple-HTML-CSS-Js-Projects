<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            background-color: #000000;
        }
        .form-container {
            background-color: rgba(255, 255, 255, 0.689);
            padding: 30px;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(240, 236, 236);
            width: 300px;
        }
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ebe4e4ce;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            border: 1px solid #5ccf65d6;
            box-shadow: 0 0 10px  #5ac960 (240, 236, 236);
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0c7811;
        }
    </style>
</head>
<body>

    <form class="form-container">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
